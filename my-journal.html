  const c = CUR[cur] || CUR.RUB;
  const abs = Math.abs(v);
  const big = c.big || 1000;
  let dec = opt.dec != null ? opt.dec : (abs >= big ? 0 : 2);
  if (c.big && abs >= c.big) dec = 0;           // в рублях копейки только на малых суммах
  const n = abs.toLocaleString('ru-RU', { minimumFractionDigits: dec, maximumFractionDigits: dec });
  const sign = v < 0 ? '−' : (opt.sign && v > 0 ? '+' : '');
  return sign + (c.suf ? n + '\u00a0' + c.s : c.s + n);
}
function shortMoney(v) {
  const c = CUR[S.settings.currency] || CUR.RUB;
  const abs = Math.abs(v);
  let n, suf = '';
  if (abs >= 1e6) { n = v / 1e6; suf = '\u00a0млн'; }
  else if (abs >= 1e4) { n = v / 1e3; suf = '\u00a0тыс.'; }
  else return money(v, { dec: 0 });
  const t = Math.abs(n) < 10 ? 1 : 0;
  const str = Math.abs(n).toLocaleString('ru-RU', { minimumFractionDigits: 0, maximumFractionDigits: t });
  const sign = v < 0 ? '−' : '';
  return sign + (c.suf ? str + suf + '\u00a0' + c.s : c.s + str + suf);
}
const pct = (v, d) => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(d == null ? 0 : d) + '%';
const ymd = d => d.toISOString().slice(0, 10);
const ym = iso => iso.slice(0, 7);
function monthLabel(key, short) {
  const [y, m] = key.split('-').map(Number);
  return (short ? MONTHS_SH[m - 1] : MONTHS[m - 1]) + (short ? ' ' + String(y).slice(2) : ' ' + y);
}
function dateHuman(iso) { const [y, m, d] = iso.split('-'); return d + '.' + m + '.' + y; }
function addMonths(key, n) {
  let [y, m] = key.split('-').map(Number); m += n;
  while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; }
  return y + '-' + String(m).padStart(2, '0');
}

/* нормализация названия продавца для правил и поиска дублей */
function merchantKey(desc) {
  return String(desc || '')
    .toLowerCase()
    .replace(/ё/g, 'е')
    .replace(/[^a-zа-яё0-9 ]+/gi, ' ')
    .replace(/\b(gmbh|ag|kg|ohg|se|ltd|inc|llc|bv|sarl|filiale|sagt danke|danke|kartenzahlung|girocard|ec|pos|nr|ref|tan|mandat|betrag|eur|usd)\b/g, ' ')
    .replace(/\b\d{2,}\b/g, ' ')
    .replace(/\s+/g, ' ').trim().split(' ').slice(0, 3).join(' ');
}
function prettyMerchant(desc) {
  const raw = String(desc || '').trim();
  let s = raw.replace(/\s+/g, ' ');
  s = s.replace(/\/\/.*$/, '').replace(/\b(kartenzahlung|girocard|lastschrift|sepa|dauerauftrag|überweisung|ueberweisung)\b/gi, '').trim();
  s = s.split(/[|;]/)[0].trim();
  if (s.length > 44) s = s.slice(0, 44).trim() + '…';
  return s || raw || 'Операция';
}

/* ------------------ категоризация ------------------ */
function categorize(desc, amount, type) {
  const text = String(desc || '').replace(/ё/g, 'е').replace(/Ё/g, 'Е');
  const key = merchantKey(text);
  if (S.rules[key]) { const r = S.rules[key]; return { cat: r.cat, sub: r.sub, conf: 1, by: 'rule' }; }
  if (type === 'income') {
    for (const [re, c, s, cf] of KEYS) if (c === 'income' && re.test(text)) return { cat: 'income', sub: s, conf: cf, by: 'dict' };
    return { cat: 'income', sub: 'otherinc', conf: .75, by: 'type' };
  }
  let best = null;
  for (const [re, c, s, cf] of KEYS) {
    if (c === 'income') continue;
    if (re.test(text)) { if (!best || cf > best.conf) best = { cat: c, sub: s, conf: cf, by: 'dict' }; }
  }
  if (best) {
    // контекст по сумме уточняет уверенность
    return best;
  }
  return { cat: 'other', sub: 'unknown', conf: .3, by: 'none' };
}

const isTransfer = t => TRANSFER_CATS.includes(t.cat);
const isSpend = t => t.type === 'expense' && !isTransfer(t);

function periodRange(code) {
  const ms = monthKeys();
  if (!ms.length) return { from: '0000-00', to: '9999-99', label: 'нет данных' };
  const last = ms[ms.length - 1];
  if (code === 'all') return { from: ms[0], to: last, label: 'весь период' };
  if (code === 'month') return { from: last, to: last, label: monthLabel(last) };
  const n = code === 'last3' ? 3 : code === 'last6' ? 6 : 12;
  const from = addMonths(last, -(n - 1));
  return { from: from < ms[0] ? ms[0] : from, to: last, label: 'последние ' + n + ' мес.' };
}
function monthKeys() {
  const set = new Set(S.tx.map(t => ym(t.date)));
  return Array.from(set).sort();
}
function inPeriod(t, r) { const k = ym(t.date); return k >= r.from && k <= r.to; }
function txIn(r) { return S.tx.filter(t => inPeriod(t, r)); }

function totals(list) {
  const income = sum(list.filter(t => t.type === 'income').map(txBase));
  const spend = sum(list.filter(isSpend).map(txBase));
  const saved = sum(list.filter(t => t.cat === 'savings' && t.type === 'expense').map(txBase));
  const invested = sum(list.filter(t => t.cat === 'invest' && t.type === 'expense').map(txBase));
  return { income, spend, saved, invested, free: income - spend - saved - invested, count: list.length };
}
function byCategory(list) {
  const m = {};
  list.filter(isSpend).forEach(t => {
    const b = txBase(t);
    (m[t.cat] = m[t.cat] || { cat: t.cat, total: 0, count: 0, subs: {} }).total += b;
    m[t.cat].count++;
    const s = m[t.cat].subs[t.sub] = m[t.cat].subs[t.sub] || { total: 0, count: 0 };
    s.total += b; s.count++;
  });
  return Object.values(m).map(x => (x.total = round2(x.total), x)).sort((a, b) => b.total - a.total);
}
function monthly(list) {
  const m = {};
  list.forEach(t => {
    const k = ym(t.date);
    const e = m[k] = m[k] || { key: k, income: 0, spend: 0, saved: 0, invested: 0 };
    const b = txBase(t);
    if (t.type === 'income') e.income += b;
    else if (t.cat === 'savings') e.saved += b;
    else if (t.cat === 'invest') e.invested += b;
    else e.spend += b;
  });
  return Object.values(m).sort((a, b) => a.key < b.key ? -1 : 1)
    .map(x => Object.assign(x, { income: round2(x.income), spend: round2(x.spend), free: round2(x.income - x.spend - x.saved - x.invested) }));
}
function mandatorySplit(list) {
  let mand = 0, opt = 0;
  list.filter(isSpend).forEach(t => {
    const w = MANDATORY[t.cat] != null ? MANDATORY[t.cat] : 0;
    const b = txBase(t);
    if (t.cat === 'food') { const w2 = (t.sub === 'groceries' || t.sub === 'supermarket') ? 1 : 0; mand += b * w2; opt += b * (1 - w2); }
    else if (t.cat === 'transport') { const w2 = (t.sub === 'taxi') ? 0 : 1; mand += b * w2; opt += b * (1 - w2); }
    else { mand += b * w; opt += b * (1 - w); }
  });
  return { mandatory: round2(mand), optional: round2(opt) };
}

/* регулярные платежи */
function recurring(opts) {
  const transfers = !!(opts && opts.transfers);
  const groups = {};
  S.tx.filter(t => transfers ? (t.type === 'expense' && TRANSFER_CATS.includes(t.cat)) : isSpend(t)).forEach(t => {
    const k = merchantKey(t.desc);
    if (!k) return;
    (groups[k] = groups[k] || { key: k, name: prettyMerchant(t.desc), items: [], cat: t.cat, sub: t.sub }).items.push(t);
  });
  const res = [];
  Object.values(groups).forEach(g => {
    if (g.items.length < 3) return;
    const items = g.items.slice().sort((a, b) => a.date < b.date ? -1 : 1);
    const amounts = items.map(txBase);
    const med = median(amounts);
    if (med <= 0) return;
    const spread = amounts.filter(a => Math.abs(a - med) / med <= 0.25).length / amounts.length;
    if (spread < 0.7) return;
    const gaps = [];
    for (let i = 1; i < items.length; i++) gaps.push((new Date(items[i].date) - new Date(items[i - 1].date)) / 86400000);
    const g0 = median(gaps);
    let freq = null;
    if (g0 >= 25 && g0 <= 36) freq = 'monthly'; else if (g0 >= 6 && g0 <= 9) freq = 'weekly'; else if (g0 >= 85 && g0 <= 100) freq = 'quarterly';
    if (!freq) return;
    const perMonth = freq === 'monthly' ? med : freq === 'weekly' ? med * 4.33 : med / 3;
    const first = items[0].date, lastSeen = items[items.length - 1].date;
    res.push({ key: g.key, name: g.name, cat: items[items.length - 1].cat, sub: items[items.length - 1].sub,
      amount: round2(med), perMonth: round2(perMonth), freq, count: items.length, first, last: lastSeen,
      isSub: SUBSCRIPTION_HINT.test(g.items[0].desc) || (items[items.length-1].sub === 'subs') });
  });
  return res.sort((a, b) => b.perMonth - a.perMonth);
}

  spends.filter(t => ym(t.date) === last && txBase(t) >= thr && !regular.has(merchantKey(t.desc))).sort((a, b) => txBase(b) - txBase(a)).slice(0, 3).forEach(t => {
    out.push({ kind: 'big', icon: '⚠️', title: 'Необычно крупная операция',
      text: `${dateHuman(t.date)} — ${esc(t.merchant)} на ${money(txBase(t))}. Это заметно выше вашей обычной операции (медиана ${money(med)}).`, tx: t });
  });
  // рост категорий
  const prev = ms.slice(-4, -1);
  byCategory(S.tx.filter(t => ym(t.date) === last)).forEach(c => {
    const prevVals = prev.map(k => sum(S.tx.filter(t => isSpend(t) && t.cat === c.cat && ym(t.date) === k).map(txBase)));
    const base = avg(prevVals);
    if (base < 30 || prevVals.length < 2) return;
    const d = (c.total - base) / base * 100;
    if (d >= 25 && c.total - base >= 40)
      out.push({ kind: 'growth', icon: '📈', title: cat(c.cat).name + ': рост расходов',
        text: `В ${monthLabel(last)} — ${money(c.total)} против среднего ${money(base)} за предыдущие ${prevVals.length} мес. Это ${pct(d)}. Возврат к среднему уровню освободил бы около ${money(c.total - base)} в месяц.`, cat: c.cat });
    if (d <= -25 && base - c.total >= 40 && out.filter(x => x.kind === 'drop').length < 2)
      out.push({ kind: 'drop', icon: '📉', title: cat(c.cat).name + ': расходы снизились',
        text: `В ${monthLabel(last)} — ${money(c.total)} против среднего ${money(base)}. Это ${pct(d)}.`, cat: c.cat });
  });
  // новые регулярные платежи
  recurring().forEach(r => {
    const fm = ym(r.first);
    if (fm >= addMonths(last, -1)) out.push({ kind: 'newsub', icon: '🔁', title: 'Новый регулярный платёж',
      text: `${esc(r.name)} — ${money(r.amount)} ${r.freq === 'monthly' ? 'в месяц' : r.freq === 'weekly' ? 'в неделю' : 'в квартал'}, впервые ${dateHuman(r.first)}. В год это около ${money(r.perMonth * 12)}.` });
  });
  out.sort((a, b) => (a.kind === 'drop' ? 1 : 0) - (b.kind === 'drop' ? 1 : 0));
  const d = duplicates();
  if (d.length) out.push({ kind: 'dup', icon: '👯', title: 'Возможные дубликаты',
    text: `Найдено совпадений: ${d.length} — операции с одинаковой датой, суммой и описанием. Проверьте их в разделе «Операции».` });
  return out;
}

/* инсайты для дашборда */
function insights() {
  const out = [];
  const ms = monthKeys(); if (ms.length < 1) return out;
  const last = ms[ms.length - 1];
  const lastTx = S.tx.filter(t => ym(t.date) === last);
  const T = totals(lastTx);
  const rec = recurring();
  const subs = rec.filter(r => r.isSub);
  if (subs.length) out.push({ em: '🔁', text: `Подписки и регулярные сервисы — <b>${money(sum(subs.map(s => s.perMonth)))}</b> в месяц, это ${money(sum(subs.map(s => s.perMonth)) * 12)} в год. Найдено ${subs.length} шт.` });
  const cats = byCategory(lastTx);
  if (cats[0]) out.push({ em: cat(cats[0].cat).icon, text: `Самая крупная статья в ${monthLabel(last)} — <b>${cat(cats[0].cat).name}</b>: ${money(cats[0].total)} (${Math.round(cats[0].total / (T.spend || 1) * 100)}% расходов, ${cats[0].count} операций).` });
  // рост категории за 3 месяца
  const prev3 = ms.slice(-4, -1);
  let bestGrow = null;
  cats.forEach(c => {
    const base = avg(prev3.map(k => sum(S.tx.filter(t => isSpend(t) && t.cat === c.cat && ym(t.date) === k).map(txBase))));
    if (base < 40) return;
    const d = (c.total - base) / base * 100;
    if (!bestGrow || d > bestGrow.d) bestGrow = { c, d, base };
  });
  if (bestGrow && bestGrow.d > 8) out.push({ em: '📊', text: `Расходы на <b>${cat(bestGrow.c.cat).name}</b> выросли на ${pct(bestGrow.d)} к среднему за 3 месяца (${money(bestGrow.c.total)} против ${money(bestGrow.base)}).` });
  // самый дорогой день
  const byDay = {};
  lastTx.filter(isSpend).forEach(t => byDay[t.date] = (byDay[t.date] || 0) + txBase(t));
  const top = Object.entries(byDay).sort((a, b) => b[1] - a[1])[0];
  if (top) out.push({ em: '📅', text: `Самый дорогой день месяца — <b>${dateHuman(top[0])}</b>: ${money(top[1])}.` });
  // доля регулярных
  if (T.spend > 0) {
    const share = Math.round(sum(rec.map(r => r.perMonth)) / T.spend * 100);
    if (share > 0) out.push({ em: '🧾', text: `<b>${clamp(share, 0, 100)}%</b> ваших расходов — повторяющиеся платежи. Их проще всего пересматривать раз в год.` });
  }
  // накопления к прошлому месяцу
  if (ms.length > 1) {
    const prevKey = ms[ms.length - 2];
    const p = totals(S.tx.filter(t => ym(t.date) === prevKey));
    if (p.saved > 0 && T.saved > 0) {
      const d = (T.saved - p.saved) / p.saved * 100;
      out.push({ em: d >= 0 ? '🐖' : '🔎', text: `В ${monthLabel(last)} вы отложили <b>${money(T.saved)}</b> — это ${pct(d)} к ${monthLabel(prevKey)}.` });
    }
  }
  return out.slice(0, 6);
}

/* финансовое здоровье */
function health() {
  const ms = monthKeys();
  const r = { total: 0, parts: [], ok: ms.length > 0 };
  if (!ms.length) return r;
  const per = monthly(S.tx);
  const full = per.length > 1 ? per : per;
  const inc = avg(full.map(m => m.income)) || 1;
  const spend = avg(full.map(m => m.spend));
  const saved = avg(full.map(m => m.saved));
  const inv = avg(full.map(m => m.invested));
  const ratio = spend / inc;
  const sExp = clamp((1 - ratio) / 0.5 * 100, 0, 100);
  const sSav = clamp(saved / inc / 0.20 * 100, 0, 100);
  const debt = avg(full.map(m => sum(S.tx.filter(t => ym(t.date) === m.key && t.cat === 'finance' && (t.sub === 'credit' || t.sub === 'interest')).map(txBase))));
  const sDebt = clamp(100 - (debt / inc) * 400, 0, 100);
  const sInv = clamp(inv / inc / 0.15 * 100, 0, 100);
  const cv = full.length > 1 ? stdev(full.map(m => m.spend)) / (avg(full.map(m => m.spend)) || 1) : 0.3;
  const sStab = clamp(100 - cv * 320, 0, 100);
  r.parts = [
    { key: 'Расходы', v: Math.round(sExp), w: .25, note: `Расходы съедают ${Math.round(ratio * 100)}% дохода. Ориентир — не больше 70%.` },
    { key: 'Накопления', v: Math.round(sSav), w: .25, note: `Вы откладываете ${Math.round(saved / inc * 100)}% дохода. Ориентир — от 20%.` },
    { key: 'Долги', v: Math.round(sDebt), w: .15, note: debt > 0 ? `Платежи по кредитам — ${Math.round(debt / inc * 100)}% дохода.` : 'В данных нет платежей по кредитам.' },
    { key: 'Инвестиции', v: Math.round(sInv), w: .15, note: `На инвестиции уходит ${Math.round(inv / inc * 100)}% дохода. Ориентир — 10–15%.` },
    { key: 'Стабильность', v: Math.round(sStab), w: .20, note: `Колебание расходов от месяца к месяцу — ${Math.round(cv * 100)}%. Чем ровнее, тем проще планировать.` }
  ];
  r.total = Math.round(sum(r.parts.map(p => p.v * p.w)));
  return r;
}

/* сценарии накоплений */
function savingsPlan() {
  const per = monthly(S.tx);
  if (!per.length) return null;
  const use = per.slice(-6);
  const inc = avg(use.map(m => m.income));
  const split = mandatorySplit(S.tx.filter(t => ym(t.date) >= use[0].key));
  const n = use.length;
  const mand = split.mandatory / n, opt = split.optional / n;
  const free = inc - mand - opt;
  const mk = (name, share, note) => ({ name, share, amount: Math.round((free * share) / 10) * 10, note });
  return {
    income: inc, mandatory: mand, optional: opt, free,
    saved: avg(use.map(m => m.saved)), invested: avg(use.map(m => m.invested)),
    scenarios: [
      mk('Осторожный', .35, 'Оставляет больше свободных денег на месяц. Подходит, если доход нерегулярный.'),
      mk('Сбалансированный', .60, 'Средний вариант: заметный прогресс по целям без жёстких ограничений.'),
      mk('Агрессивный', .85, 'Быстрее всего наполняет резерв, но почти не оставляет запаса на непредвиденное.')
    ]
  };
}
function reserveState() {
  const p = savingsPlan();
  if (!p) return null;
  const target = p.mandatory * S.settings.reserveMonths;
  const current = round2(sum(S.tx.filter(t => t.cat === 'savings' && t.type === 'expense').map(txBase)) + (S.settings.manualReserve || 0));
  return { monthly: p.mandatory, target, current, months: p.mandatory > 0 ? current / p.mandatory : 0, missing: Math.max(0, target - current) };
}

/* ---------- donut ---------- */
function donutChart(items, opts) {
  opts = opts || {};
  const total = sum(items.map(i => i.value)) || 1;
  const R = 92, r = 60, cx = 110, cy = 110;
  let a0 = -Math.PI / 2, paths = '';
  items.forEach(it => {
    const frac = it.value / total;
    const a1 = a0 + frac * Math.PI * 2;
    const large = frac > .5 ? 1 : 0;
    const gap = frac > .02 ? 0.012 : 0;
    const s = a0 + gap, e = a1 - gap;
    const p = [
      'M', cx + R * Math.cos(s), cy + R * Math.sin(s),
      'A', R, R, 0, large, 1, cx + R * Math.cos(e), cy + R * Math.sin(e),
      'L', cx + r * Math.cos(e), cy + r * Math.sin(e),
      'A', r, r, 0, large, 0, cx + r * Math.cos(s), cy + r * Math.sin(s), 'Z'
    ].join(' ');
    const tip = `<b>${esc(it.label)}</b><br>${money(it.value)} · ${(frac * 100).toFixed(1)}%${it.count != null ? `<br><span class="k">операций:</span> ${it.count}` : ''}`;
    paths += `<path d="${p}" fill="${it.color}" data-tip="${esc(tip)}" style="cursor:pointer" ${it.id ? `data-slice="${it.id}"` : ''}></path>`;
    a0 = a1;
  });
  const center = opts.center || money(total);
  return `<div style="display:flex; gap:22px; align-items:center; flex-wrap:wrap; justify-content:center">
    <svg class="chart" viewBox="0 0 220 220" style="width:220px; height:220px; flex:0 0 220px">
      ${paths}
      <text x="110" y="104" text-anchor="middle" fill="var(--muted)" font-size="11" font-weight="600">${esc(opts.centerLabel || 'всего')}</text>
      <text x="110" y="126" text-anchor="middle" fill="var(--ink)" font-size="19" font-weight="800">${esc(center)}</text>
    </svg>
    <div style="flex:1; min-width:190px">
      ${items.map(i => `<div class="legend-i" style="justify-content:space-between; padding:4px 0">
        <span style="display:flex; align-items:center; gap:8px; min-width:0"><i class="dot" style="background:${i.color}"></i>${esc(i.label)}</span>
        <span class="v">${money(i.value)} · ${(i.value / total * 100).toFixed(0)}%</span></div>`).join('')}
    </div></div>`;
}

/* ---------- линейный / площадной график ---------- */
let GRAD = 0;
function lineChart(cfg) {
  const gid = 'grad' + (++GRAD);
  const W = 760, H = cfg.height || 230, PL = 52, PR = 14, PT = 16, PB = 28;
  const labels = cfg.labels, series = cfg.series;
  const n = labels.length;
  const allv = series.flatMap(s => s.values);
  let max = Math.max(...allv, 1), min = cfg.zero === false ? Math.min(...allv, 0) : 0;
  if (min > 0) min = 0;
  const pad = (max - min) * .12 || 1; max += pad;
  const X = i => PL + (n === 1 ? (W - PL - PR) / 2 : i * (W - PL - PR) / (n - 1));
  const Y = v => PT + (H - PT - PB) * (1 - (v - min) / (max - min));
  const ticks = 4;
  let grid = '';
  for (let i = 0; i <= ticks; i++) {
    const v = min + (max - min) * i / ticks, y = Y(v);
    grid += `<line x1="${PL}" x2="${W - PR}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>
      <text x="${PL - 8}" y="${y + 4}" text-anchor="end" font-size="10.5" fill="var(--muted)" font-weight="600">${shortMoney(v)}</text>`;
  }
  let body = '';
  series.forEach((s, si) => {
    const pts = s.values.map((v, i) => [X(i), Y(v)]);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    if (s.area) {
      body += `<defs><linearGradient id="${gid}_${si}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${s.color}" stop-opacity=".28"/><stop offset="100%" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs>
        <path d="${d} L ${X(n - 1)} ${Y(min)} L ${X(0)} ${Y(min)} Z" fill="url(#${gid}_${si})"/>`;
    }
    body += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2.4}" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="6 5"' : ''}/>`;
    body += pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="var(--paper)" stroke="${s.color}" stroke-width="2"/>`).join('');
  });
  let hover = '';
  for (let i = 0; i < n; i++) {
    const w = (W - PL - PR) / Math.max(n, 1);
    const tip = `<b>${esc(labels[i])}</b>` + series.map(s => `<br><span class="k">${esc(s.name)}:</span> ${money(s.values[i])}`).join('');
    hover += `<rect x="${X(i) - w / 2}" y="${PT}" width="${w}" height="${H - PT - PB}" fill="transparent" data-tip="${esc(tip)}"/>`;
    hover += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-weight="600">${esc(labels[i])}</text>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%; height:auto">${grid}${body}${hover}</svg>
    ${series.length > 1 ? `<div class="legend">${series.map(s => `<span class="legend-i"><i class="dot" style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>` : ''}`;
}

/* ---------- столбцы ---------- */
function barChart(cfg) {
  const W = 760, H = cfg.height || 200, PL = 52, PR = 10, PT = 12, PB = 26;
  const n = cfg.labels.length, max = Math.max(...cfg.values.map(Math.abs), 1) * 1.15;
  const bw = Math.min(46, (W - PL - PR) / n * .62);
  const X = i => PL + (i + .5) * (W - PL - PR) / n;
  const Y = v => PT + (H - PT - PB) * (1 - v / max);
  let grid = '';
  for (let i = 0; i <= 3; i++) {
    const v = max * i / 3, y = Y(v);
    grid += `<line x1="${PL}" x2="${W - PR}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${PL - 8}" y="${y + 4}" text-anchor="end" font-size="10.5" fill="var(--muted)" font-weight="600">${shortMoney(v)}</text>`;
  }
  const bars = cfg.values.map((v, i) => {
    const y = Y(Math.abs(v)), h = Math.max(2, H - PB - y);
    const col = cfg.colors ? cfg.colors[i] : (cfg.color || 'var(--accent)');
    const tip = `<b>${esc(cfg.labels[i])}</b><br>${money(v)}` + (cfg.extra ? '<br>' + cfg.extra[i] : '');
    return `<rect x="${X(i) - bw / 2}" y="${y}" width="${bw}" height="${h}" rx="6" fill="${col}" data-tip="${esc(tip)}"/>
      <text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-weight="600">${esc(cfg.labels[i])}</text>`;

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%; height:auto">${grid}${bars}</svg>`;
}

/* ============================================================
   Импорт файлов: CSV / XLSX / XLS / TXT / PDF
   ============================================================ */
function splitCSVLine(line, d) {
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (q) {
      if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === d) { out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out.map(s => s.trim());
}
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
  const lines = text.split('\n').filter(l => l.trim() !== '');
  if (!lines.length) return [];
  const cand = [';', ',', '\t', '|'];
  let best = ',', bestScore = -1;
  cand.forEach(d => {
    const counts = lines.slice(0, 12).map(l => splitCSVLine(l, d).length);
    const m = median(counts);
    const consistent = counts.filter(c => c === m).length / counts.length;
    const score = m > 1 ? m * consistent : 0;
    if (score > bestScore) { bestScore = score; best = d; }
  });
  return lines.map(l => splitCSVLine(l, best));
}
function parseNumberLoose(v) {
  if (typeof v === 'number') return v;

  if (!s) return NaN;

    if (lastC > lastD) s = s.replace(/\./g, '').replace(',', '.');
    else s = s.replace(/,/g, '');
  } else if (lastC > -1) {
    const dec = s.length - lastC - 1;
    s = dec <= 2 && s.split(',').length === 2 ? s.replace(',', '.') : s.replace(/,/g, '');
  }
  const n = parseFloat(s);
  if (isNaN(n)) return NaN;
  return neg ? -n : n;
}
function parseDateLoose(v, prefDMY) {

  }
  const s = String(v == null ? '' : v).trim();
  if (!s) return null;
  let m = s.match(/(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
  if (m) return `${m[1]}-${String(+m[2]).padStart(2, '0')}-${String(+m[3]).padStart(2, '0')}`;
  m = s.match(/(\d{1,2})[-./](\d{1,2})[-./](\d{2,4})/);
  if (m) {
    let a = +m[1], b = +m[2], y = +m[3];
    if (y < 100) y += y > 70 ? 1900 : 2000;
    let day = a, mon = b;
    if (prefDMY === false || (a <= 12 && b > 12)) { day = b; mon = a; }
    if (day > 31 || mon > 12) return null;
    return `${y}-${String(mon).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
  }
  const MRU = { 'янв':1,'фев':2,'мар':3,'апр':4,'мая':5,'май':5,'июн':6,'июл':7,'авг':8,'сен':9,'окт':10,'ноя':11,'дек':12,
    'jan':1,'feb':2,'mar':3,'apr':4,'may':5,'jun':6,'jul':7,'aug':8,'sep':9,'oct':10,'nov':11,'dec':12 };
  m = s.toLowerCase().match(/(\d{1,2})\s*([a-zа-я]{3,})\.?\s*(\d{4})/);
  if (m && MRU[m[2].slice(0, 3)]) return `${m[3]}-${String(MRU[m[2].slice(0, 3)]).padStart(2, '0')}-${String(+m[1]).padStart(2, '0')}`;
  const d = new Date(s);
  if (!isNaN(d) && s.length > 5) return ymd(d);
  return null;
}

const HEAD_HINTS = {
  date: /^(дата|date|datum|buchungstag|valuta|wertstellung|дата операции|дата транзакции|transaction date|posted|booking date|день)/i,
  desc: /^(описание|назначение|описание операции|операция|description|verwendungszweck|beschreibung|buchungstext|details|merchant|магазин|контрагент|payee|получатель|место|name|narrative|комментарий|организация)/i,
  amount: /^(сумма|amount|betrag|value|итог|сумма операции|total|umsatz|сумма в валюте счета|amount \(eur\))/i,
  debit: /^(расход|дебет|debit|soll|списание|ausgang|withdrawal|payment|выдача|outflow)/i,
  credit: /^(приход|кредит|credit|haben|зачисление|eingang|deposit|поступление|inflow)/i,
  cur: /^(валюта|currency|waehrung|währung|cur|iso)/i,
  type: /^(тип|type|вид|операция тип|art|direction|kind)/i,
  cat: /^(категория|category|kategorie|группа)/i,
  merchant: /^(магазин|продавец|merchant|shop|store|организация|контрагент|payee|получатель)/i
};

function analyzeTable(rows) {
  rows = rows.filter(r => r.some(c => String(c == null ? '' : c).trim() !== ''));
  if (!rows.length) return null;
  const width = Math.max(...rows.map(r => r.length));
  const norm = rows.map(r => { const a = r.slice(); while (a.length < width) a.push(''); return a; });
  // шапка?
  let headerIdx = -1;
  for (let i = 0; i < Math.min(6, norm.length); i++) {
    const cells = norm[i].map(c => String(c == null ? '' : c).trim());
    const hits = cells.filter(c => Object.values(HEAD_HINTS).some(re => re.test(c))).length;
    const numeric = cells.filter(c => !isNaN(parseNumberLoose(c)) && c !== '').length;
    if (hits >= 2 && numeric <= 1) { headerIdx = i; break; }
  }
  const header = headerIdx >= 0 ? norm[headerIdx].map(c => String(c || '').trim()) : null;
  const body = norm.slice(headerIdx >= 0 ? headerIdx + 1 : 0);
  const cols = [];
  for (let c = 0; c < width; c++) {
    const vals = body.map(r => r[c]).filter(v => String(v == null ? '' : v).trim() !== '');
    const sample = vals.slice(0, 400);
    const dmyEvidence = sample.filter(v => { const m = String(v).match(/^(\d{1,2})[-./](\d{1,2})[-./]\d{2,4}/); return m && +m[1] > 12; }).length;
    const mdyEvidence = sample.filter(v => { const m = String(v).match(/^(\d{1,2})[-./](\d{1,2})[-./]\d{2,4}/); return m && +m[2] > 12; }).length;
    const prefDMY = mdyEvidence > dmyEvidence ? false : true;
    const dateHits = sample.filter(v => parseDateLoose(v, prefDMY)).length;
    const numHits = sample.filter(v => !isNaN(parseNumberLoose(v)) && String(v).replace(/[^\d]/g, '').length <= 12).length;
    const curHits = sample.filter(v => /^(eur|usd|gbp|chf|rub|pln|czk|€|\$|£|₽)$/i.test(String(v).trim())).length;
    const textHits = sample.filter(v => /[a-zа-яё]{3,}/i.test(String(v))).length;
    const avgLen = avg(sample.map(v => String(v).length));
    const hName = header ? header[c] : '';
    cols.push({ i: c, name: hName || ('Столбец ' + (c + 1)), prefDMY,
      dateScore: (dateHits / (sample.length || 1)) + (hName && HEAD_HINTS.date.test(hName) ? .6 : 0),
      numScore: (numHits / (sample.length || 1)) + (hName && HEAD_HINTS.amount.test(hName) ? .6 : 0),
      curScore: (curHits / (sample.length || 1)) + (hName && HEAD_HINTS.cur.test(hName) ? .6 : 0),
      textScore: (textHits / (sample.length || 1)) * (Math.min(avgLen, 40) / 40) + (hName && HEAD_HINTS.desc.test(hName) ? .6 : 0),
      debitHint: hName ? HEAD_HINTS.debit.test(hName) : false,
      creditHint: hName ? HEAD_HINTS.credit.test(hName) : false,
      typeHint: hName ? HEAD_HINTS.type.test(hName) : false,
      catHint: hName ? HEAD_HINTS.cat.test(hName) : false,
      merchHint: hName ? HEAD_HINTS.merchant.test(hName) : false,
      negatives: sample.filter(v => parseNumberLoose(v) < 0).length,
      sample: sample.slice(0, 3)
    });
  }
  const bestBy = k => cols.slice().sort((a, b) => b[k] - a[k])[0];
  const dateCol = bestBy('dateScore');
  const numCols = cols.filter(c => c.numScore > .75 && c !== dateCol).sort((a, b) => b.numScore - a.numScore);
  const debit = cols.find(c => c.debitHint), credit = cols.find(c => c.creditHint);
  const amountCol = debit && credit ? null : (numCols[0] || null);
  const descCol = cols.filter(c => c !== dateCol).sort((a, b) => b.textScore - a.textScore)[0];
  const curCol = cols.find(c => c.curScore > .7) || null;
  const typeCol = cols.find(c => c.typeHint) || null;
  const catCol = cols.find(c => c.catHint) || null;
  const merchCol = cols.find(c => c.merchHint && c !== descCol) || null;
  const map = {
    date: dateCol && dateCol.dateScore > .6 ? dateCol.i : null,
    amount: amountCol ? amountCol.i : null,
    debit: debit ? debit.i : null, credit: credit ? credit.i : null,
    desc: descCol && descCol.textScore > .25 ? descCol.i : null,
    cur: curCol ? curCol.i : null, type: typeCol ? typeCol.i : null,
    cat: catCol ? catCol.i : null, merchant: merchCol ? merchCol.i : null,
    prefDMY: dateCol ? dateCol.prefDMY : true
  };
  const confident = map.date != null && (map.amount != null || (map.debit != null && map.credit != null)) && map.desc != null;
  return { header, body, cols, map, confident, width };
}

function buildTransactions(parsed, map) {
  const out = [], bad = [];
  const hasSign = (() => {
    if (map.amount == null) return true;
    return parsed.body.some(r => parseNumberLoose(r[map.amount]) < 0);
  })();
  parsed.body.forEach((r, idx) => {
    const dRaw = map.date != null ? r[map.date] : null;
    const date = parseDateLoose(dRaw, map.prefDMY);
    let amount = null, type = 'expense';
    if (map.debit != null || map.credit != null) {
      const d = map.debit != null ? parseNumberLoose(r[map.debit]) : NaN;
      const c = map.credit != null ? parseNumberLoose(r[map.credit]) : NaN;
      if (!isNaN(c) && Math.abs(c) > 0) { amount = Math.abs(c); type = 'income'; }
      else if (!isNaN(d) && Math.abs(d) > 0) { amount = Math.abs(d); type = 'expense'; }
    } else if (map.amount != null) {
      const v = parseNumberLoose(r[map.amount]);
      if (!isNaN(v)) { amount = Math.abs(v); type = hasSign ? (v >= 0 ? 'income' : 'expense') : 'expense'; }
    }
    const desc = [map.desc != null ? r[map.desc] : '', map.merchant != null ? r[map.merchant] : '']
      .map(x => String(x == null ? '' : x).trim()).filter(Boolean).join(' ');
    if (!date || amount == null || !isFinite(amount) || amount === 0) { bad.push({ row: idx + 1, raw: r.join(' | ').slice(0, 90) }); return; }
    if (map.type != null) {
      const tv = String(r[map.type] || '').toLowerCase();
      if (/(income|приход|доход|credit|haben|eingang|поступлен)/.test(tv)) type = 'income';
      if (/(expense|расход|debit|soll|ausgang|списан)/.test(tv)) type = 'expense';
    }
    let cur = S.settings.currency || 'RUB';
    if (map.cur != null) {
      const cv = String(r[map.cur] || '').trim().toUpperCase().replace('€', 'EUR').replace('$', 'USD').replace('£', 'GBP').replace('₽', 'RUB').replace('₸', 'KZT').replace('РУБ', 'RUB').replace('Р.', 'RUB');
      if (CUR[cv]) cur = cv;
    }
    if (!hasSign && type === 'expense') {
      if (/\b(gehalt|salary|зарплат|lohn|payroll|honorar|erstattung|refund|возврат|dividend)\b/i.test(desc)) type = 'income';
    }
    let c = categorize(desc, amount, type);
    if (map.cat != null) {
      const raw = String(r[map.cat] || '').trim();
      const found = Object.entries(allCats()).find(([k, v]) => v.name.toLowerCase() === raw.toLowerCase());
      if (found) c = { cat: found[0], sub: Object.keys(found[1].subs)[0], conf: .95, by: 'file' };
    }
    out.push({ id: uid(), date, desc: desc || 'Операция', merchant: prettyMerchant(desc), amount: round2(amount),
      type, cur, cat: c.cat, sub: c.sub, conf: c.conf, note: '', account: 'Импорт', src: 'import' });
  });
  return { tx: out, bad };
}

/* ---------- чтение файла ---------- */
async function readAnyFile(file) {
  const name = file.name.toLowerCase();
  if (/\.(xlsx|xls)$/.test(name)) {
    if (typeof XLSX === 'undefined') throw new Error('Библиотека для Excel не загрузилась. Проверьте соединение или сохраните файл в CSV.');
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { cellDates: true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
  }
  if (/\.pdf$/.test(name)) {
    const text = await readPdfText(file);
    return pdfTextToRows(text);
  }
  const text = await file.text();
  if (/\.txt$/.test(name) && !/[;,\t|]/.test(text.split('\n')[0] || '')) return pdfTextToRows(text);
  return parseCSV(text);
}
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('script'));
    document.head.appendChild(s);
  });
}
async function readPdfText(file) {
  if (typeof pdfjsLib === 'undefined') {
    try { await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'); }
    catch (e) { throw new Error('Чтение PDF недоступно в этом окружении. Сохраните выписку в CSV или XLSX — это надёжнее и точнее.'); }
  }
  try {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const buf = await file.arrayBuffer();
    const doc = await pdfjsLib.getDocument({ data: buf }).promise;
    let text = '';
    for (let p = 1; p <= doc.numPages; p++) {
      const page = await doc.getPage(p);
      const c = await page.getTextContent();
      let lastY = null, line = '';
      c.items.forEach(it => {
        const y = Math.round(it.transform[5]);
        if (lastY != null && Math.abs(y - lastY) > 3) { text += line.trim() + '\n'; line = ''; }
        line += it.str + ' '; lastY = y;
      });
      text += line.trim() + '\n';
    }
    return text;
  } catch (e) {
    throw new Error('Не удалось прочитать PDF. Экспортируйте выписку в CSV или XLSX — банки отдают такой формат без потери структуры.');
  }
}
/* строки «свободного» текста → таблица: дата ... описание ... сумма */
const STMT_NOISE = /^(выписка по|страница\s+\d|дата операции|дата обработки|категория$|описание операции|сумма в валюте|остаток средств|в валюте сч[её]та|продолжение на следующей|итого по операциям|расшифровка операций|владелец сч[её]та|номер сч[её]та|карты, привязанные|валюта$|дата открытия|дата закрытия|остаток на\b|пополнение\b|списание\b|дата формирования|пао сбербанк|денежные средства|в выписке отображ|срок обработки|для проверки|зайдите в приложение|нажмите кнопку|получите документ|предоставляя|действителен|сертификат|владелец:|дата подписи|скачать электронный|проверить подпись|согласно статье|документ подписан|сведения о сертификате|\d{3}\s+www\.|ул\.\s|заказано в|итого\b|всего\b|balance)/i;
const AMT_SRC = '[+\\u2212\\u2013-]?\\s?\\d{1,3}(?:[\\s\\u00a0]\\d{3})*[.,]\\d{2}|[+\\u2212\\u2013-]?\\s?\\d+[.,]\\d{2}';

/* Многострочные банковские выписки (Сбер и похожие):
   строка 1 — дата, время, категория банка, сумма операции и остаток по счёту;
   строка 2 — дата обработки, код авторизации и описание, которое может переноситься. */
function parseStatementBlocks(lines, curCode) {
  const head = new RegExp('^(\\d{1,2}[./]\\d{1,2}[./]\\d{2,4})\\s+(\\d{1,2}:\\d{2})\\s+(.*)$');
  const detail = new RegExp('^(\\d{1,2}[./]\\d{1,2}[./]\\d{2,4})\\s+(\\d{4,10})\\s*(.*)$');
  const anyDate = /^\d{1,2}[./]\d{1,2}[./]\d{2,4}\b/;
  const amtG = new RegExp('(' + AMT_SRC + ')(?!\\d)', 'g');
  const ops = [];
  let cur = null;
  const flush = () => {
    if (cur && cur.amount != null) {
      const desc = [cur.desc.replace(/\s{2,}/g, ' ').trim(), cur.category].filter(Boolean).join(' · ');
      ops.push([cur.date, desc || 'Операция', cur.amount, curCode]);
    }
    cur = null;
  };
  for (const raw of lines) {
    const l = raw.trim();
    if (!l || STMT_NOISE.test(l)) { if (cur) cur.closed = true; continue; }
    const h = l.match(head);
    if (h) {
      flush();
      const rest = h[3];
      const found = rest.match(amtG);
      if (!found) { cur = null; continue; }
      const amtRaw = found.length >= 2 ? found[found.length - 2] : found[0];
      const positive = /^\s*\+/.test(amtRaw);
      const val = parseFloat(amtRaw.replace(/[+\u2212\u2013-]/g, '').replace(/[\s\u00a0]/g, '').replace(',', '.'));
      if (!isFinite(val) || val === 0) { cur = null; continue; }
      let category = rest;
      found.forEach(a => { category = category.replace(a, ' '); });
      category = category.replace(/\s{2,}/g, ' ').trim();
      cur = { date: h[1], category, desc: '', amount: (positive ? '' : '-') + val.toFixed(2), closed: false };
      continue;
    }
    if (!cur || cur.closed) continue;
    const d = l.match(detail);
    if (d) { cur.desc += ' ' + d[3]; continue; }
    if (anyDate.test(l)) { cur.closed = true; continue; }
    if (cur.desc && cur.desc.length < 160) cur.desc += ' ' + l;
  }
  flush();
  return ops;
}

let FILE_META = {};
function pdfTextToRows(text) {
  const lines = text.split(/\n/).map(l => l.replace(/\u00a0/g, ' ').replace(/\s{2,}/g, ' ').trim());
  // остаток на счёте: берём самую позднюю из строк «Остаток на ДД.ММ.ГГГГ …»
  FILE_META = {};
  lines.forEach(l => {
    const m = l.match(/(?:остаток|баланс)[^\d]{0,14}(\d{1,2}[.\/]\d{1,2}[.\/]\d{2,4})\s+([\d\s]+[.,]\d{2})/i);
    if (!m) return;
    const iso = parseDateLoose(m[1], true);
    const val = parseFloat(m[2].replace(/[\s\u00a0]/g, '').replace(',', '.'));
    if (!iso || !isFinite(val)) return;
    if (!FILE_META.balanceDate || iso > FILE_META.balanceDate) { FILE_META.balanceDate = iso; FILE_META.balance = round2(val); }
  });
  let curCode = S.settings.currency || 'RUB';
  const cm = text.match(/(российск\w* рубл\w*|\bRUB\b|₽)|(\bEUR\b|евро|€)|(\bUSD\b|доллар\w*|\$)|(\bKZT\b|тенге|₸)|(\bBYN\b|белорусск\w* рубл\w*)/i);
  if (cm) curCode = cm[1] ? 'RUB' : cm[2] ? 'EUR' : cm[3] ? 'USD' : cm[4] ? 'KZT' : 'BYN';

  const blocks = parseStatementBlocks(lines, curCode);
  if (blocks.length >= 3) return [['Дата', 'Описание', 'Сумма', 'Валюта']].concat(blocks);

  const amtG = new RegExp('(' + AMT_SRC + ')(?!\\d)', 'g');
  const rows = [];
  lines.forEach(l => {
    if (!l || STMT_NOISE.test(l)) return;
    const dm = l.match(/(\d{1,2}[-./]\d{1,2}[-./]\d{2,4}|\d{4}-\d{2}-\d{2})/);
    if (!dm) return;
    const am = l.match(amtG);
    if (!am) return;
    const signed = am.find(a => /^\s*[+\u2212\u2013-]/.test(a));
    const amount = signed || (am.length >= 2 ? am[am.length - 2] : am[0]);
    let desc = l.replace(dm[0], ' ');
    am.forEach(a => { desc = desc.replace(a, ' '); });
    desc = desc.replace(/\s{2,}/g, ' ').trim();
    rows.push([dm[0], desc || 'Операция', amount.replace(/[\s\u00a0]/g, ''), curCode]);
  });
  if (rows.length) rows.unshift(['Дата', 'Описание', 'Сумма', 'Валюта']);
  return rows;
}

let IMPORT = null;
async function handleFile(file) {
  try {
    toast('Читаю <b>' + esc(file.name) + '</b>…');
    const rows = await readAnyFile(file);
    if (!rows || rows.length < 2) throw new Error('В файле не найдено строк с операциями. Поддерживаются CSV, XLSX, XLS, TXT и текстовые PDF.');
    const parsed = analyzeTable(rows);
    if (!parsed) throw new Error('Файл пуст.');
    IMPORT = { file: file.name, parsed, meta: Object.assign({}, FILE_META) };
    if (parsed.confident) showReview();
    else showMapping();
  } catch (e) {
    modal({ title: 'Файл не удалось прочитать', body: `<p>${esc(e.message)}</p>`, foot: `<button class="btn primary" data-x>Понятно</button>` });
  }
}

/* ============================================================
   «Сколько можно спокойно потратить»: остаток на счетах минус
   запланированные платежи до следующего дохода и минус резерв.
   ============================================================ */
function refToday() {
  const real = ymd(new Date());
  if (!S.tx.length) return real;
  const last = S.tx.map(t => t.date).sort().slice(-1)[0];
  return real <= last ? real : last;
}
function addDaysISO(iso, n) {
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() + n);
  return ymd(d);
}
function daysBetween(a, b) {
  return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
}
function dayShort(iso) {
  const [y, m, d] = iso.split('-');
  return Number(d) + ' ' + MONTHS_SH[Number(m) - 1];
}
function dimOf(y, m) { return new Date(y, m, 0).getDate(); }

/* дни поступлений: аванс и зарплата — это разные даты одного месяца */
function paydayDays() {
  const inc = S.tx.filter(t => t.type === 'income' && txBase(t) > 0);
  if (!inc.length) return [];
  const months = new Set(inc.map(t => ym(t.date)));
  const base = median(inc.map(txBase));
  const freq = {};
  inc.filter(t => txBase(t) >= base * .4).forEach(t => {
    const d = Number(t.date.slice(8, 10));
    freq[d] = (freq[d] || 0) + 1;
  });
  const need = Math.max(2, Math.ceil(months.size * .5));
  return Object.keys(freq).filter(d => freq[d] >= need).map(Number).sort((a, b) => a - b);
}
function nextOn(day, from) {
  let y = Number(from.slice(0, 4)), m = Number(from.slice(5, 7));
  for (let i = 0; i < 3; i++) {
    const d = Math.min(day, dimOf(y, m));
    const iso = y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    if (iso > from) return iso;
    m++; if (m > 12) { m = 1; y++; }
  }
  return addDaysISO(from, 30);
}
function nextPayday(from) {
  from = from || refToday();
  if (S.settings.payday) return { date: nextOn(+S.settings.payday, from), day: +S.settings.payday, source: 'settings' };
  const days = paydayDays();
  if (days.length) {
    const cands = days.map(d => ({ date: nextOn(d, from), day: d })).sort((a, b) => a.date < b.date ? -1 : 1);
    return { date: cands[0].date, day: cands[0].day, source: 'income' };
  }
  const y = Number(from.slice(0, 4)), m = Number(from.slice(5, 7));
  const eom = y + '-' + String(m).padStart(2, '0') + '-' + String(dimOf(y, m)).padStart(2, '0');
  return { date: eom > from ? eom : addDaysISO(from, 30), day: 0, source: 'eom' };
}

/* счёт, а не просто частая трата: аренда, связь, подписки, страховки, переводы на накопления */
function isBill(r) {
  if (r.isSub || r.sub === 'subs') return true;
  if (['housing', 'finance', 'savings', 'invest'].includes(r.cat)) return true;
  if (r.cat === 'health' && r.sub === 'insurance') return true;
  if (r.cat === 'fun' && r.sub === 'hobby') return true;
  if (r.cat === 'transport' && r.sub === 'public') return true;
  if (r.cat === 'education' && (r.sub === 'edusubs' || r.sub === 'study')) return true;
  return false;
}

/* предстоящие списания между from и to, по регулярным платежам */
function plannedPayments(from, to) {
  const out = [];
  recurring().filter(isBill).concat(recurring({ transfers: true })).forEach(r => {
    if (r.freq === 'quarterly') return;
    const step = r.freq === 'weekly' ? 7 : 0;
    if (step) {
      let d = r.last;
      for (let i = 0; i < 12; i++) {
        d = addDaysISO(d, step);
        if (d > to) break;
        if (d > from) out.push({ key: r.key, name: r.name, cat: r.cat, sub: r.sub, amount: r.amount, date: d, overdue: false });
      }
      return;
    }
    const day = Number(r.last.slice(8, 10));
    let y = Number(from.slice(0, 4)), m = Number(from.slice(5, 7));
    for (let i = 0; i < 3; i++) {
      const dd = Math.min(day, dimOf(y, m));
      const iso = y + '-' + String(m).padStart(2, '0') + '-' + String(dd).padStart(2, '0');
      if (iso > to) break;
      if (iso > r.last) {
        // платёж этого цикла ещё не проходил
        const overdue = iso < from;
        out.push({ key: r.key, name: r.name, cat: r.cat, sub: r.sub, amount: r.amount, date: overdue ? from : iso, realDate: iso, overdue });
      }
      m++; if (m > 12) { m = 1; y++; }
    }
  });
  return out.sort((a, b) => a.date < b.date ? -1 : 1);
}

function safeToSpend() {
  const today = refToday();
  const pay = nextPayday(today);
  const planned = plannedPayments(today, pay.date);
  const plannedSum = round2(sum(planned.map(p => p.amount)));
  const reserve = +S.settings.keepReserve || 0;
  const balance = S.settings.balance == null ? null : +S.settings.balance;
  const days = Math.max(1, daysBetween(today, pay.date));
  const free = balance == null ? null : round2(balance - plannedSum - reserve);
  const perDay = free == null ? null : free / days;
  const todaySpent = round2(sum(S.tx.filter(t => t.date === today && isSpend(t)).map(txBase)));
  return { today, pay, planned, plannedSum, reserve, balance, free, days, perDay, todaySpent };
}

function plural(n, a, b, c) {

/* ---------- быстрая запись операции одной строкой ---------- */
function parseQuick(raw) {
  let s = ' ' + String(raw || '').replace(/\u00a0/g, ' ').trim() + ' ';
  if (!s.trim()) return null;
  let type = /^\s*\+/.test(raw) || /\s(доход|зарплат[\p{L}]*|аванс|получил[\p{L}]*|вернули|кэшбэк|кешбэк|премия)\s/iu.test(s) ? 'income' : 'expense';
  let date = refToday();
  if (/\sпозавчера\s/i.test(s)) { date = addDaysISO(date, -2); s = s.replace(/\sпозавчера\s/ig, ' '); }
  else if (/\sвчера\s/i.test(s)) { date = addDaysISO(date, -1); s = s.replace(/\sвчера\s/ig, ' '); }
  else s = s.replace(/\sсегодня\s/ig, ' ');
  const dm = s.match(/\s(\d{1,2}[./]\d{1,2}(?:[./]\d{2,4})?)\s/);
  if (dm) {
    const parts = dm[1].split(/[./]/);
    const iso = parseDateLoose(parts.length < 3 ? dm[1] + '.' + new Date().getFullYear() : dm[1], true);
    if (iso) { date = iso; s = s.replace(dm[1], ' '); }
  }
  let account = '';
  const am = s.match(/\s(?:с|со|на|картой|карта|сч[её]т|наличными)\s+([\p{L}][\p{L}\p{N}\- ]{1,20})\s*$/iu);
  if (am) { account = am[1].trim(); s = s.slice(0, am.index) + ' '; }
  const nums = s.match(/\s\+?\d{1,3}(?:[\s\u00a0]\d{3})+(?:[.,]\d{1,2})?\s|\s\+?\d+(?:[.,]\d{1,2})?\s/g);
  if (!nums || !nums.length) return { type, date, account, desc: s.trim(), amount: null };
  const rawAmt = nums[nums.length - 1];
  const amount = parseFloat(rawAmt.replace(/[\s\u00a0+]/g, '').replace(',', '.'));
  const at = s.lastIndexOf(rawAmt);
  s = s.slice(0, at) + ' ' + s.slice(at + rawAmt.length);
  const desc = s.replace(/\s{2,}/g, ' ').replace(/^[\s+]+/, '').trim();
  if (!isFinite(amount) || amount <= 0) return { type, date, account, desc, amount: null };
  const c = categorize(desc, amount, type);
  return { type, date, account, desc: desc || 'Операция', amount: round2(amount), cat: c.cat, sub: c.sub, conf: c.conf };
}
function quickChips(p) {

    p.date !== today ? `<span class="qchip">${esc(dayShort(p.date))}</span>` : ''

}

/* ---------- кольцевой индикатор для целей ---------- */
function ringChart(p, size, color, label) {
  const S0 = size || 56, r = S0 / 2 - 5, c = 2 * Math.PI * r, v = clamp(p, 0, 100);

    <circle cx="${S0 / 2}" cy="${S0 / 2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="5"/>

      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - v / 100)}"
      transform="rotate(-90 ${S0 / 2} ${S0 / 2})"/>
    ${label ? `<text x="${S0 / 2}" y="${S0 / 2 + 4}" text-anchor="middle" font-size="${S0 > 70 ? 14 : 11}" font-weight="800" fill="var(--ink)">${esc(label)}</text>` : ''}

}

/* ============================================================
   Операции
   ============================================================ */
function filteredTx() {
  const f = VIEW.txFilter || {};
  const rec = f.recurring ? new Set(recurring().map(r => r.key)) : null;
  const dupIds = f.dupOnly ? new Set(duplicates().flatMap(d => [d.a.id, d.b.id])) : null;
  return S.tx.filter(t => {
    if (f.q) {
      const q = f.q.toLowerCase();
      if (!(t.desc + ' ' + t.merchant + ' ' + cat(t.cat).name + ' ' + subName(t.cat, t.sub) + ' ' + (t.note || '')).toLowerCase().includes(q)) return false;
    }
    if (f.cat && t.cat !== f.cat) return false;
    if (f.sub && t.sub !== f.sub) return false;
    if (f.type === 'income' && t.type !== 'income') return false;
    if (f.type === 'expense' && !isSpend(t)) return false;
    if (f.type === 'transfer' && !isTransfer(t)) return false;
    if (f.cur && t.cur !== f.cur) return false;
    if (f.from && t.date < f.from) return false;
    if (f.to && t.date > f.to) return false;
    if (f.min != null && txBase(t) < f.min) return false;
    if (f.max != null && txBase(t) > f.max) return false;
    if (rec && !rec.has(merchantKey(t.desc))) return false;
    if (dupIds && !dupIds.has(t.id)) return false;
    return true;
  });
}
function viewTx() {
  const f = VIEW.txFilter || {};
  const list = filteredTx();
  const PAGE = 40;
  const pages = Math.max(1, Math.ceil(list.length / PAGE));
  VIEW.txPage = clamp(VIEW.txPage, 1, pages);

function optimization() {
  const ms = monthKeys(); if (ms.length < 2) return [];
  const last = ms[ms.length - 1], prev = ms.slice(-4, -1);
  const res = [];
  const pairs = {};
  S.tx.filter(isSpend).forEach(t => {
    const k = t.cat + ':' + t.sub;
    (pairs[k] = pairs[k] || { cat: t.cat, sub: t.sub, last: 0, prev: {} });
    if (ym(t.date) === last) pairs[k].last += txBase(t);
    else if (prev.includes(ym(t.date))) pairs[k].prev[ym(t.date)] = (pairs[k].prev[ym(t.date)] || 0) + txBase(t);
  });
  const OPTIONAL = { 'food:restaurant': 1, 'food:cafe': .8, 'food:delivery': 1, 'fun:subs': 1, 'fun:games': .9, 'fun:events': .7,
    'shopping:clothes': .9, 'shopping:other': .8, 'shopping:electronics': .7, 'transport:taxi': .9, 'travel:trfun': .6, 'fun:hobby': .5 };
  Object.entries(pairs).forEach(([k, v]) => {
    const base = avg(prev.map(m => v.prev[m] || 0));
    if (v.last < 30 || base < 15) return;
    const diff = v.last - base;
    const w = OPTIONAL[k] != null ? OPTIONAL[k] : .25;
    if (diff <= 10 || w < .5) return;
    res.push({ cat: v.cat, sub: v.sub, last: round2(v.last), base: round2(base), diff: round2(diff),
      growth: base ? diff / base * 100 : 0, saveLow: round2(diff * .6), saveHigh: round2(diff * w) });
  });
  return res.sort((a, b) => b.diff - a.diff).slice(0, 5);
}
function forecast() {
  const per = monthly(S.tx);
  if (!per.length) return null;
  const use = per.slice(-6);
  const m = avg(use.map(x => x.spend));
  return { monthly: m, year: m * 12, cuts: [5, 10, 15].map(p => ({ p, monthly: m * (1 - p / 100), year: m * 12 * (1 - p / 100), save: m * 12 * p / 100 })) };
}

function calendarHtml(key) {
  const [y, m] = key.split('-').map(Number);
  const first = new Date(Date.UTC(y, m - 1, 1));
  const days = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const shift = (first.getUTCDay() + 6) % 7;
  const byDay = {};
  S.tx.filter(t => isSpend(t) && ym(t.date) === key).forEach(t => byDay[t.date] = (byDay[t.date] || 0) + txBase(t));
  const max = Math.max(...Object.values(byDay), 1);
  const dows = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'];
  let html = dows.map(d => `<div class="dow">${d}</div>`).join('');
  for (let i = 0; i < shift; i++) html += '<div class="day void"></div>';
  for (let d = 1; d <= days; d++) {
    const iso = `${key}-${String(d).padStart(2, '0')}`;
    const v = byDay[iso] || 0;
    const a = v ? clamp(.12 + v / max * .8, .12, .95) : 0;
    html += `<div class="day" data-day="${iso}" style="${v ? `background:color-mix(in srgb, var(--accent) ${Math.round(a * 55)}%, var(--paper)); border-color:transparent` : ''}"

      <b style="${v && a > .5 ? 'color:var(--accent)' : ''}">${d}</b><span style="${v ? 'color:var(--ink)' : 'color:var(--muted)'}">${v ? shortMoney(v) : ''}</span></div>`;
  }
  return `<div class="cal">${html}</div><p class="muted" style="font-size:12.5px; margin:12px 0 0">Нажмите на день, чтобы увидеть операции.</p>`;

    foot: `<button class="btn primary" data-x>Готово</button>`

}
/* ============================================================
   Бюджет
   ============================================================ */
function viewBudget() {
  const ms = monthKeys(), last = ms[ms.length - 1] || ym(refToday());
  const spent = {};
  S.tx.filter(t => isSpend(t) && ym(t.date) === last).forEach(t => spent[t.cat] = (spent[t.cat] || 0) + txBase(t));
  const rows = Object.entries(S.budgets).map(([k, limit]) => ({ cat: k, limit, spent: round2(spent[k] || 0) }))
    .sort((a, b) => (b.spent / (b.limit || 1)) - (a.spent / (a.limit || 1)));
  const totalLimit = sum(rows.map(r => r.limit)), totalSpent = sum(rows.map(r => r.spent));
  const free = Object.keys(allCats()).filter(k => !S.budgets[k] && k !== 'income');
  const daysIn = new Date(Number(last.slice(0, 4)), Number(last.slice(5, 7)), 0).getDate();
  const today = Math.min(daysIn, new Date().getDate());
  const daysLeft = Math.max(0, daysIn - today);

  const monthP = Math.round(today / daysIn * 100);
  return `
  <div class="card plan-head" style="margin-bottom:16px">
    <div class="plan-top">
      <div>
        <div class="muted" style="font-size:13px; font-weight:600">Осталось</div>

        <div class="muted" style="font-size:13.5px">${daysLeft > 0
          ? `\u2248 ${money(Math.max(0, leftTotal) / daysLeft)} в день · ещё ${daysLeft} ${plural(daysLeft, 'день', 'дня', 'дней')}`

      </div>
      ${ringChart(monthP, 78, 'var(--accent)', monthP + '%')}
    </div>
    <div class="bar" style="height:10px; margin-top:14px"><i style="width:${clamp(totalSpent / (totalLimit || 1) * 100, 0, 100)}%; background:${totalSpent > totalLimit ? 'var(--neg)' : 'var(--accent)'}"></i><b class="pace" style="left:${clamp(monthP, 0, 100)}%"></b></div>
    <p class="muted" style="font-size:13px; margin:10px 0 0">${money(totalSpent)} из ${money(totalLimit)}. Прошло ${today} из ${daysIn} дней месяца — чёрточка показывает ровный темп, это ${money(totalLimit / daysIn * today)} к сегодняшнему дню.</p>
  </div>
  <div class="grid g2" style="margin-bottom:16px">
    ${rows.length ? rows.map(r => {
      const left = r.limit - r.spent, p = clamp(r.spent / (r.limit || 1) * 100, 0, 100);
      const over = left < 0;
      return `<div class="card">
        <div style="display:flex; align-items:center; gap:9px; margin-bottom:10px">
          <span class="ava" style="background:${catColor(r.cat)}22; color:${catColor(r.cat)}">${cat(r.cat).icon}</span>
          <b style="flex:1">${esc(cat(r.cat).name)}</b>
          <button class="btn sm ghost" data-budget="${r.cat}">Изменить</button></div>
        <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px">
          <b style="font-size:20px">${money(r.spent)}</b><span class="muted" style="font-weight:600">лимит ${money(r.limit)}</span></div>
        <div class="bar"><i style="width:${p}%; background:${over ? 'var(--neg)' : p > 85 ? 'var(--warn)' : 'var(--pos)'}"></i><b class="pace" style="left:${clamp(today / daysIn * 100, 0, 100)}%"></b></div>
        <div style="margin-top:8px; font-size:13.5px; font-weight:600; color:${over ? 'var(--neg)' : 'var(--ink-2)'}">
          ${over ? `Превышение ${money(-left)}` : `Осталось ${money(left)}`}

          <span class="muted" style="font-weight:600; display:block; margin-top:2px">${p > today / daysIn * 100 + 4 ? 'быстрее ровного темпа' : p < today / daysIn * 100 - 4 ? 'медленнее ровного темпа' : 'идёте ровно по темпу'}</span></div>
      </div>`;
    }).join('') : `<div class="card"><div class="empty"><h3>Бюджет ещё не задан</h3><p>Добавьте лимит хотя бы для одной категории — приложение подскажет, сколько вы уже потратили.</p></div></div>`}
  </div>
  <div class="card">
    <div class="card-head"><h3>Добавить лимит</h3></div>
    <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end">
      <div style="flex:1; min-width:180px"><label class="fl">Категория</label>

}
function bindBudget() {
  const add = $('#bAdd');

      <div><div class="muted" style="font-size:12.5px; font-weight:600">Осталось накопить</div><b style="font-size:20px">${money(totalNeed)}</b></div>

        </span>
        <button class="btn sm ghost" data-goal="${g.id}">Изменить</button></div>
      <div class="bar" style="height:8px; margin-top:12px"><i style="width:${p}%; background:var(--accent)"></i></div>
      <div style="display:flex; justify-content:space-between; margin-top:8px; font-size:13.5px; font-weight:600">

    </div>`;
  }).join('')}</div>` : `<div class="card"><div class="empty"><h3>Целей пока нет</h3><p>Цель — это способ превратить свободные деньги в конкретный результат: машину, поездку или резерв.</p>

function monthsBetween(a, b) {

}

/* ============================================================
   Инвестиционный потенциал
   ============================================================ */
function viewInvest() {
  const p = savingsPlan(), res = reserveState();
  if (!p) return '<div class="card"><div class="empty"><h3>Нужны данные</h3><p>Загрузите операции, чтобы увидеть расчёт.</p></div></div>';
  const reserveReady = res && res.current >= res.target;
  const lo = Math.round(Math.max(0, p.free * .45) / 10) * 10, hi = Math.round(Math.max(0, p.free * .65) / 10) * 10;
  const rate = VIEW.rate != null ? VIEW.rate : (S.settings.currency === 'RUB' ? 12 : 5);
  const years = 10, monthlyAmt = VIEW.invAmt != null ? VIEW.invAmt : hi;
  const series = [], contrib = [];
  let bal = 0, put = 0;
  for (let y = 1; y <= years; y++) {
    for (let m = 0; m < 12; m++) { bal = bal * (1 + rate / 100 / 12) + monthlyAmt; put += monthlyAmt; }
    series.push(round2(bal)); contrib.push(round2(put));
  }
  return `
  <div class="card" style="margin-bottom:16px">
    <div class="card-head"><h3>Сколько потенциально остаётся для долгосрочных вложений</h3></div>
    <div class="stat-row" style="margin-bottom:14px">
      <div class="stat"><div class="lbl">Средний доход</div><div class="val" style="color:var(--pos)">${money(p.income)}</div></div>
      <div class="stat"><div class="lbl">Средние расходы</div><div class="val">${money(p.mandatory + p.optional)}</div></div>
      <div class="stat"><div class="lbl">Свободный остаток</div><div class="val">${money(p.free)}</div></div>
      <div class="stat"><div class="lbl">Уже инвестируется</div><div class="val">${money(p.invested)}</div></div>
    </div>
    <div class="card" style="background:var(--paper-2); border-style:dashed">
      <b style="font-size:15px">${reserveReady ? 'Резерв сформирован' : 'Сначала резерв, потом вложения'}</b>
      <p style="font-size:13.5px; color:var(--ink-2); margin:6px 0 0">

  return JSON.stringify({
    валюта: S.settings.currency,

    категории_за_3_мес: cats.map(c => ({ категория: cat(c.cat).name, сумма: c.total, операций: c.count,
      подкатегории: Object.entries(c.subs).map(([k, v]) => ({ имя: subName(c.cat, k), сумма: round2(v.total), операций: v.count })) })),
    регулярные_платежи: rec.map(r => ({ название: r.name, сумма: r.amount, в_месяц: r.perMonth })),
    свободные_деньги: p ? { доход: round2(p.income), обязательные: round2(p.mandatory), необязательные: round2(p.optional), свободно: round2(p.free) } : null
  });
}
async function answerSmart(q, el) {
  const sample = window.claude ? await window.claude.use('sample') : null;
  if (!sample) return null;
  const prompt = `Ты — аналитик личных финансов внутри приложения. Отвечай по-русски, коротко (до 120 слов), только на основе данных ниже. Не выдумывай числа, которых нет. Не давай инвестиционных рекомендаций и не обещай доходность; используй формулировки «по вашим данным», «ориентировочно», «если структура расходов сохранится». Если данных для ответа нет — скажи об этом прямо.

ДАННЫЕ ПОЛЬЗОВАТЕЛЯ (агрегированные, без описаний операций):
${aiContext()}

ВОПРОС: ${q}`;
  try {
    const res = await sample(prompt, { modelTier: 'quick', onText: ({ text }) => { el.innerHTML = esc(text).replace(/\n/g, '<br>'); } });
    return res.text;
  } catch (e) {
    return null;
  }
}

function bindAssistant() {
  const send = async (text) => {
    if (!text.trim()) return;
    CHAT.push({ role: 'u', text });
    const local = answerLocal(text);
    CHAT.push({ role: 'a', text: local });
    render();
    const chat = $('#chat'); if (chat) chat.scrollTop = chat.scrollHeight;
    if (S.settings.smartAI && S.tx.length) {
      const holder = $('#chat').lastElementChild;
      const extra = document.createElement('div');
      extra.className = 'msg a'; extra.innerHTML = '<span class="muted">Думаю…</span>';
      $('#chat').appendChild(extra);
      const res = await answerSmart(text, extra);
      if (res) { CHAT.push({ role: 'a', text: esc(res).replace(/\n/g, '<br>') }); }
      else extra.remove();
      render();
    }
  };
  $('#aiGo').onclick = () => { const v = $('#aiQ').value; $('#aiQ').value = ''; send(v); };
  $('#aiQ').onkeydown = e => { if (e.key === 'Enter') { const v = e.target.value; e.target.value = ''; send(v); } };
  $$('[data-q]').forEach(b => b.onclick = () => send(b.getAttribute('data-q')));
  $('#aiSmart').onchange = e => { S.settings.smartAI = e.target.checked; save(); };
}

function txToRows(list) {
  const head = ['Дата', 'Описание', 'Продавец', 'Сумма', 'Валюта', 'Сумма в ' + S.settings.currency, 'Тип', 'Категория', 'Подкатегория', 'Счёт', 'Комментарий'];
  const rows = list.map(t => [t.date, t.desc, t.merchant, t.amount, t.cur, txBase(t),
    t.type === 'income' ? 'Доход' : isTransfer(t) ? 'Перевод' : 'Расход', cat(t.cat).name, subName(t.cat, t.sub), t.account || '', t.note || '']);
  return [head].concat(rows);
}
function toCSV(rows) {
  return rows.map(r => r.map(v => {
    const s = String(v == null ? '' : v);
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(';')).join('\n');
}
async function saveFile(filename, data) {
  const dl = window.claude ? await window.claude.use('downloads') : null;
  if (dl) {
    try { await dl.save({ filename, data }); toast('Файл сохранён: <b>' + esc(filename) + '</b>'); return true; }
    catch (e) { if (e && e.code === 'declined') return false; }
  }
  try {
    const blob = data instanceof Blob ? data : new Blob([data], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('Файл подготовлен: <b>' + esc(filename) + '</b>');
    return true;
  } catch (e) {
    modal({ title: 'Скопируйте данные', body: `<p class="muted">Сохранение файлов в этом окне недоступно. Скопируйте содержимое вручную.</p>
      <textarea style="min-height:280px">${esc(typeof data === 'string' ? data : '')}</textarea>`, foot: '<button class="btn primary" data-x>Готово</button>' });
    return false;
  }
}
function exportDialog(list) {
  list = list || S.tx;
  modal({
    title: 'Экспорт данных',
    body: `<p class="muted" style="margin-top:0">Будет выгружено операций: <b>${list.length}</b>. Файл формируется в браузере, данные никуда не отправляются.</p>
      <div class="grid g3">
        <button class="btn" id="exCsv" style="flex-direction:column; height:96px">CSV<span class="muted" style="font-size:12px; font-weight:600">таблица для Excel и Google Sheets</span></button>
        <button class="btn" id="exXlsx" style="flex-direction:column; height:96px">Excel (XLSX)<span class="muted" style="font-size:12px; font-weight:600">операции + сводка по категориям</span></button>
        <button class="btn" id="exPdf" style="flex-direction:column; height:96px">Финансовый отчёт<span class="muted" style="font-size:12px; font-weight:600">печать или сохранение в PDF</span></button>
      </div>
      <div class="hr"></div>
      <button class="btn sm ghost" id="exJson">Выгрузить все данные приложения в JSON (резервная копия)</button>`,
    onMount(w) {
      $('#exCsv', w).onclick = () => { saveFile('operacii.csv', '\uFEFF' + toCSV(txToRows(list))); closeModal(); };
      $('#exXlsx', w).onclick = () => {
        if (typeof XLSX === 'undefined') { toast('Библиотека Excel недоступна — используйте CSV'); return; }
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(txToRows(list)), 'Операции');
        const cats = byCategory(list);
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Категория', 'Сумма', 'Операций', 'Доля %']]
          .concat(cats.map(c => [cat(c.cat).name, c.total, c.count, Math.round(c.total / (sum(cats.map(x => x.total)) || 1) * 100)]))), 'Категории');
        const per = monthly(list);
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Месяц', 'Доходы', 'Расходы', 'Накопления', 'Инвестиции', 'Свободно']]
          .concat(per.map(m => [m.key, m.income, m.spend, m.saved, m.invested, m.free]))), 'По месяцам');
        const buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
        saveFile('finansy.xlsx', new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
        closeModal();
      };
      $('#exPdf', w).onclick = () => { closeModal(); printReport(); };
      $('#exJson', w).onclick = () => { saveFile('ledger-backup.json', JSON.stringify(S, null, 2)); closeModal(); };
    }
  });

  { t: 'Мы распределим операции по категориям', p: '«Пятёрочка» станет продуктами, «Лукойл АЗС» — топливом, «Яндекс Плюс» — подпиской. Если ошибёмся, поправьте категорию один раз: дальше приложение запомнит правило.' },
  { t: 'Посмотрим, куда уходят деньги', p: 'Графики по категориям и месяцам, поиск крупных трат, регулярные платежи, аномалии и сравнение периодов.' },
  { t: 'Составим финансовый план', p: 'Бюджет, цели, размер подушки и сценарии накоплений — с расчётом, сколько вы потенциально можете откладывать. Решение всегда остаётся за вами.' }
];
function onboarding(step) {
  step = step || 0;
  const s = STEPS[step], last = step === STEPS.length - 1;
  modal({
    title: s.t,
    body: `<div style="display:flex; gap:6px; margin-bottom:16px">${STEPS.map((_, i) => `<i style="height:3px; flex:1; border-radius:2px; background:${i <= step ? 'var(--accent)' : 'var(--line)'}"></i>`).join('')}</div>
      <p style="font-size:15px; color:var(--ink-2); margin:0">${esc(s.p)}</p>
      ${last ? `<div class="hr"></div><div style="display:flex; gap:10px; flex-wrap:wrap">
        <button class="btn primary" id="obImport">Загрузить файл</button>
        <button class="btn" id="obDemo">Начать с демо-данных</button></div>` : ''}`,
    foot: last ? '' : `<button class="btn ghost" id="obSkip">Пропустить</button><button class="btn primary" id="obNext">Дальше</button>`,
    onMount(w) {
      const done = () => { S.settings.onboarded = true; save(); };
      if ($('#obNext', w)) $('#obNext', w).onclick = () => onboarding(step + 1);
      if ($('#obSkip', w)) $('#obSkip', w).onclick = () => { done(); closeModal(); render(); };
      if ($('#obImport', w)) $('#obImport', w).onclick = () => { done(); closeModal(); $('#filePick').click(); };
      if ($('#obDemo', w)) $('#obDemo', w).onclick = () => { done(); loadDemo(); closeModal(); go('dashboard'); toast('Демо-данные загружены: <b>' + S.tx.length + '</b> операций'); };
    }
  });
}
function applyTheme() {
  const t = S.settings.theme;
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
}
function init() {
  const had = load();
  applyTheme();
  $('#filePick').addEventListener('change', e => { const f = e.target.files[0]; if (f) handleFile(f); e.target.value = ''; });
  $('#railImport').onclick = () => $('#filePick').click();
  let dragTimer;
  ['dragover', 'dragenter'].forEach(ev => window.addEventListener(ev, e => {
    e.preventDefault();
    clearTimeout(dragTimer);
    if(document.getElementById('fin').hidden)return;
    LGROOT.classList.add('dragging');
  }));
  window.addEventListener('dragleave', () => { dragTimer = setTimeout(() => LGROOT.classList.remove('dragging'), 120); });
  window.addEventListener('drop', e => {
    e.preventDefault(); LGROOT.classList.remove('dragging'); if(document.getElementById('fin').hidden)return;
    const f = e.dataTransfer && e.dataTransfer.files[0];
    if (f) handleFile(f);
  });
  render();
  if (!S.settings.onboarded && !had) onboarding(0);
}
load();
window.LG={totals,txIn,money,render,show(){if(!this.on){this.on=1;init()}else render()}};
})();
</script></body></html>
